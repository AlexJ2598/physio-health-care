
name: PhysioHealthCare Backend CD

on:
  workflow_run:
    workflows:
      - "PhysioHealthCare CI"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: physiohealthcare-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend to Azure
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout successful CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish API
        run: dotnet publish ./PhysioHealthCare/PhysioHealthCare.csproj --configuration Release --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: physiohealthcare-api-dev
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

      - name: Smoke test - API health checks
        shell: bash
        env:
          API_BASE_URL: https://physiohealthcare-api-dev-f9etdvavcdejekce.westus3-01.azurewebsites.net
        run: |
          set -euo pipefail

          check_health() {
            local endpoint="$1"
            local max_attempts=12
            local delay_seconds=10
            local status

            for ((attempt=1; attempt<=max_attempts; attempt++)); do
              status=$(curl --silent --show-error \
                --output /dev/null \
                --max-time 10 \
                --write-out "%{http_code}" \
                "${API_BASE_URL}${endpoint}") || status="000"

              echo "${endpoint}: attempt ${attempt}/${max_attempts}, HTTP ${status}"

              if [[ "${status}" == "200" ]]; then
                echo "PASS: ${endpoint}"
                return 0
              fi

              if (( attempt < max_attempts )); then
                sleep "${delay_seconds}"
              fi
            done

            echo "::error::Health check failed: ${endpoint}"
            return 1
          }

          check_health "/health/live"
          check_health "/health/ready"
