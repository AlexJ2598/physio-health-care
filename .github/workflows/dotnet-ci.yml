name: PhysioHealthCare CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend .NET 9
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release

  frontend:
    name: Frontend Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: PhysioHealthCare.Web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: PhysioHealthCare.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build
