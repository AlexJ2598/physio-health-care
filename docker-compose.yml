services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: physiohealthcare-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=PhysioHealthCareDb;User Id=sa;Password=${SQL_SERVER_PASSWORD:?SQL_SERVER_PASSWORD is required};TrustServerCertificate=True"
      JwtSettings__Key: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      JwtSettings__Issuer: "PhysioHealthCare"
      JwtSettings__Audience: "PhysioHealthCareUsers"
      JwtSettings__ExpiresInMinutes: "60"
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: physiohealthcare-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SQL_SERVER_PASSWORD:?SQL_SERVER_PASSWORD is required}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
